name: Tests

# Lint, Tailwind freshness check and the test suite. pull-request.yaml and
# publish.yaml call it, so there is one definition. It can also be run by hand
# from the Actions tab on any branch, without publishing anything.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  TAILWIND_VERSION: '4.3.4'

jobs:
  test:
    name: 🧪 Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgres://user:password@localhost:5432/vault
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry
        run: |
          pipx install poetry
          pipx inject poetry "poethepoet[poetry_plugin]"

      - name: 🔧 Install dependencies
        run: poetry install

      - name: 🎨 Check Tailwind CSS is up to date
        run: |
          mkdir -p bin
          curl -sL -o bin/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x bin/tailwindcss
          poetry css-check

      - name: 🧪 Run tests
        run: poetry test
